[pytest]
# Pytest configuration for Django tests
# CRITICAL: Ensures tests run against a separate test database

DJANGO_SETTINGS_MODULE = settings

# Basic pytest configuration
addopts = -v

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# WARNING: Always use Django's test runner for database tests!
# Run with: python manage.py test src.tests.test_trends_api
# This ensures:
#   1. Separate test database (test_db.sqlite3) is created
#   2. Production db.sqlite3 is NEVER touched
#   3. Test database is destroyed after tests complete
